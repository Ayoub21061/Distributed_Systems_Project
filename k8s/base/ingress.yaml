apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: photo-service
spec:
  ingressClassName: nginx 
  rules:
    - host: photo.localhost
      http: 
        paths: 
          - path: /
            pathType: Prefix
            backend:
              service:
                name: photo-service
                port: 
                  number: 80


  

